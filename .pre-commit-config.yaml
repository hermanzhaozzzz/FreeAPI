default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: project-checks
        name: project checks
        entry: ./scripts/check.sh
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]

      - id: project-tests
        name: project tests
        entry: ./scripts/test.sh
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
