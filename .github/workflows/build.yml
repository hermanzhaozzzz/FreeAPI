name: macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration and lifecycle
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./scripts/package.sh universal
      - uses: actions/upload-artifact@v4
        with:
          name: FreeAPI-macOS
          path: |
            dist/FreeAPI-macOS.zip
            dist/SHA256SUMS
